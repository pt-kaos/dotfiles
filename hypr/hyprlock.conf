# hyprlock — screen locker
# Bound to SUPER+L (see awesomeconf/keybindings.lua) and used by hypridle's
# lock_cmd. Colours ($bg $fg $accent $critical ...) come from colors.conf,
# generated by theme/apply.sh from theme/palette.sh.
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true  # pressing Enter on an empty field is not a failed try
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 6
    color = $bg   # fallback / tint if the screenshot is unavailable
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 44
    font_family = Roboto
    color = $fg
    position = 0, 90
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 15
    font_family = Roboto
    color = $fg_dim
    position = 0, 45
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 260, 48
    outline_thickness = 2
    dots_size = 0.30
    dots_spacing = 0.15
    dots_center = true
    rounding = 10

    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    check_color = $accent
    fail_color = $critical

    fade_on_empty = true       # field (box, outline, placeholder) is invisible
                               # while empty; it fades in on the first keystroke
    fade_timeout = 1000        # ms the field stays empty before fading back out
    placeholder_text = <i>Password…</i>
    fail_text = <i>Wrong ($ATTEMPTS)</i>
    hide_input = false

    position = 0, -20
    halign = center
    valign = center
}
