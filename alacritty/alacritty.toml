# Colours come from colors.toml, generated by theme/apply.sh from theme/palette.sh.
[general]
import = ["~/.config/alacritty/colors.toml"]

[font]
size = 11.0

[font.bold]
family = "hack"
style = "Bold"

[font.bold_italic]
family = "hack"
style = "Bold Italic"

[font.italic]
family = "hack"
style = "Italic"

[font.normal]
family = "hack"
style = "Regular"

[scrolling]
history = 50000

[window]
opacity = 0.9

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
